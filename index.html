
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KVN Improvement</title>
  <meta name="theme-color" content="#075ca8">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f4f9ff;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,.1);
    }

    h1 { color: #075ca8; }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      background: #075ca8;
      color: white;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>KVN IMPROVEMENT</h1>
      <p>Đang mở hệ thống đề xuất cải tiến...</p>
      <a id="openApp" href="#">Mở hệ thống</a>
    </div>
  </div>

  <script>
    const APP_URL =
      "https://script.google.com/a/macros/krugersf.com/s/AKfycbxJ-EXnT0_nLz2rP7jVj2JivzYJ2uapBvPQBOehos1Q5_U6CsWZcjMTAwaAFOKXtkPiIg/exec";

    document.getElementById("openApp").href = APP_URL;

    // Chuyển thẳng đến Google Apps Script.
    window.location.replace(APP_URL);
  </script>
</body>
</html>
